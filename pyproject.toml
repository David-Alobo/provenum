[project]
name = "provenum"
version = "0.1.0"
description = "Keep the numbers in a manuscript tied to the data that produced them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Obeh Alobo" }]
keywords = ["latex", "reproducibility", "scientific-writing", "research-software", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/David-Alobo/provenum"
Issues = "https://github.com/David-Alobo/provenum/issues"

[project.scripts]
provenum = "provenum.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
